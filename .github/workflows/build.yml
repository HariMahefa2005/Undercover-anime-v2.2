
name: Build Anime Undercover APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AnimeUndercoverAndroid.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q AnimeUndercoverAndroid.zip -d project

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"

      - name: Build APK
        run: $RUNNER_TEMP/gradle-8.9/bin/gradle --no-daemon assembleDebug
        working-directory: project/AnimeUndercoverAndroid

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeUndercover-APK
          path: project/AnimeUndercoverAndroid/app/build/outputs/apk/debug/app-debug.apk
